      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk CandlePro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CandlePro-apk
          path: CandlePro.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Candle Pro (build ${{ github.run_number }})
          files: CandlePro.apk
